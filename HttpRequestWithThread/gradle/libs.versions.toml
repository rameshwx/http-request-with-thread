[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
composeBom = "2026.09.00"
composeCompiler = "2.3.10"
ksp = "2.3.12"
hilt = "2.60.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
